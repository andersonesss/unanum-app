worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_cache_path /var/cache/nginx/unanum levels=1:2 keys_zone=api_cache:10m max_size=256m inactive=10m use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=img:10m rate=2r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    upstream unanum {
        server app:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name unanum.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name unanum.ru;

        ssl_certificate     /etc/letsencrypt/live/unanum.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/unanum.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        location /static/ {
            alias /var/www/unanum/static/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        location = /api/tarot/library {
            limit_req zone=api burst=100 nodelay;
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_pass http://unanum;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/share/templates/public {
            limit_req zone=api burst=100 nodelay;
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_pass http://unanum;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/tarot/card/ {
            limit_req zone=api burst=100 nodelay;
            proxy_cache api_cache;
            proxy_cache_valid 200 1h;
            proxy_pass http://unanum;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/generate-card {
            limit_req zone=img burst=2 nodelay;
            limit_conn perip 2;
            proxy_pass http://unanum;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /api/generate-share-card {
            limit_req zone=img burst=2 nodelay;
            limit_conn perip 2;
            proxy_pass http://unanum;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            limit_req zone=api burst=100 nodelay;
            limit_conn perip 50;
            proxy_pass http://unanum;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            client_max_body_size 6m;
        }
    }
}
